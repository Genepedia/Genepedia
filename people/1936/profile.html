<h1>Michiel Johan Bester</h1>

<p>Sy eerste huwelik met Hester Jacoba Viljoen was op 27 Desember 1920 Postmasburg en na sy oorlede is tree hy weer in die huwelik op 16 September 1929 Postmasburg met Hester Jacoba Viljoen. Hul mag dalk niggies gewees het.</p>
