<h1>James Johannes Jacobus Justus Bean</h1>

<p>Jimmy Bean was an electrical engineer. Installed the first hydro-electric power station on the dam wall at Clanwilliam with his eldest son Richard (Dick). He later started Springbok Cafe on Beach Road in Strand.</p>
