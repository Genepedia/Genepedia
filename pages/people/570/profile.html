<h1>Cornelis Johannes de Beer</h1>

<p>Drie van die De Beers kinders blind toe hulle kleintyd pokke opgedoen het. Hulle ma Alida Jacoba Meintjes kon goed klavier speel en sy het die blinde kinders geleer klavier speel sodat hulle later jare 'n bestaan daaruit kon maak.</p>
