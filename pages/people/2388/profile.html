<h1>Frederik Petrus Cloete</h1>

<p>The witnesses at his baptism on 19 June 1892 in Griekwastad were Fredrik Petrus Cloete, Alida Petronella Swanepoel, Theunis Johannes Duvenhage and Jacomina Margaretha Swart.</p>
<p>Note by André Grové</p>
