<h1>Thomas Henry Sinden</h1>

<p>Thomas and his sister Elizabeth are twins.     Thomas moved to Hopetown in the late 1850's. On his death Thomas owed the following plots of land. Dover, Wimbledon and the Downs in  the settlement called  &quot;Albania&quot;  Griqualand West .</p>
