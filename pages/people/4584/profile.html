<h1>Andries Nicolaas Bester</h1>

<p>Woon Sandkraal Langeberg wyk Swellendam. Vertrek eerste helfte van 1837 na Natal. Hierdie Egpaar vermoor by Bloukransrivier Natal op 17 Februarie 1838. Hulle nagelate besittings word deur Gert Maritz op 6, 7, en 9 Maart opgeveil. Erkenning aan Ds Andre Bester</p>
