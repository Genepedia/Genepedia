<h1>Petrus Jacobus van Bosch</h1>

<p>Petrus Jacobus van Bosch gebore 24 Jun 1896 was getroud met Hendrina Maria Johanna Visagie en die kinders hier geplaas hoort by Petrus Johannes van Bosch sy neef.</p>
